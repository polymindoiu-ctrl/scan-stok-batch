<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Batch Input</title>
    
    <!-- HTML5-QRCode CDN untuk Scanner QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- CSS STYLES -->
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* HEADER */
        header {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .brand p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-online {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-offline {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-online { background-color: var(--success-color); }
        .dot-offline { background-color: var(--error-color); }

        /* CARDS */
        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-danger {
            background-color: var(--error-color);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 14px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        label span.req {
            color: var(--error-color);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .info-text {
            font-size: 0.75rem;
            margin-top: 4px;
            color: var(--text-muted);
        }

        /* AUTOCOMPLETE / DROPDOWN SUGGESTIONS */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0 0 var(--radius) var(--radius);
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: var(--shadow);
            display: none;
        }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:hover {
            background-color: #f8fafc;
        }

        .suggestion-item .item-code {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .suggestion-item .item-desc {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        /* QR SCANNER CONTAINER */
        #scanner-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .scanner-box {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        #reader {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 12px;
        }

        /* ALERTS AND NOTIFICATIONS */
        .alert {
            padding: 12px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            margin-bottom: 14px;
            display: none;
        }

        .alert-error {
            background-color: #fef2f2;
            color: var(--error-color);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: var(--success-color);
            border: 1px solid #bbf7d0;
        }

        .alert-warning {
            background-color: #fffbeb;
            color: var(--warning-color);
            border: 1px solid #fef3c7;
        }

        /* ACTIONS */
        .action-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        /* LOADING INDICATOR */
        .loading-overlay {
            display: none;
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(255, 255, 255, 0.7);
            border-radius: var(--radius);
            justify-content: center;
            align-items: center;
            font-weight: 600;
            color: var(--primary-color);
            z-index: 50;
        }

        .relative { position: relative; }

        /* FITUR TABEL DATA HARI INI */
        .today-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .today-list-header h2 {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .today-count {
            font-size: 0.8rem;
            background-color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: left;
        }

        .data-table th {
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 8px 10px;
            font-weight: 700;
            border-bottom: 1px solid #cbd5e1;
            white-space: nowrap;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .data-table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .data-table tbody tr:hover {
            background-color: #eff6ff;
        }

        .data-table tfoot td {
            background-color: #f1f5f9;
            font-weight: 700;
            border-top: 2px solid #cbd5e1;
        }

        .empty-today {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <h1>STOCK BATCH</h1>
                <p>Input Data Stok Firebase</p>
            </div>
            <div id="connectionStatus" class="status-badge status-offline">
                <span class="dot dot-offline"></span> <span id="statusText">Checking...</span>
            </div>
        </header>

        <!-- MAIN FORM CARD -->
        <div class="card relative">
            <div id="loadingOverlay" class="loading-overlay">
                <span id="loadingText">Memuat Data...</span>
            </div>

            <!-- NOTIFICATION MESSAGES -->
            <div id="alertBox" class="alert"></div>

            <button type="button" id="btnScanQR" class="btn btn-primary" style="margin-bottom: 16px;">
                📷 SCAN QR
            </button>

            <form id="stockForm" autocomplete="off" onsubmit="return false;">
                <!-- ITEM CODE -->
                <div class="form-group">
                    <label for="itemCode">Item Code <span class="req">*</span></label>
                    <input type="text" id="itemCode" placeholder="Ketik atau Scan QR..." required>
                    <div id="itemSuggestions" class="suggestions-list"></div>
                </div>

                <!-- ITEM DESC (DIBUKA UNTUK INPUT MANUAL & AUTOCOMPLETE API) -->
                <div class="form-group">
                    <label for="itemName">Item Desc <span class="req">*</span></label>
                    <input type="text" id="itemName" placeholder="Ketik deskripsi (contoh: *java*aged*)...">
                    <div id="descSuggestions" class="suggestions-list"></div>
                    <div class="info-text">Tips: Gunakan tanda bintang (*) untuk pencarian wildcard/kata terpisah.</div>
                </div>

                <!-- BATCH EDITABLE & SUGGESTION -->
                <div class="form-group">
                    <label for="batchInput">Batch <span class="req">*</span></label>
                    <input type="text" id="batchInput" placeholder="Pilih/Ketik Batch..." required>
                    <div id="batchSuggestions" class="suggestions-list"></div>
                    <div id="batchInfo" class="info-text"></div>
                </div>

                <!-- QTY -->
                <div class="form-group">
                    <label for="qtyInput">Qty <span class="req">*</span></label>
                    <input type="number" id="qtyInput" step="any" min="0.01" placeholder="Masukkan jumlah stok" required>
                </div>

                <!-- REMARK -->
                <div class="form-group">
                    <label for="remarkInput">Remark</label>
                    <input type="text" id="remarkInput" placeholder="Contoh: Palet 12 (opsional)">
                </div>

                <!-- POSISI -->
                <div class="form-group">
                    <label for="posisiInput">Posisi</label>
                    <input type="text" id="posisiInput" placeholder="Contoh: Rak A1 (opsional)">
                </div>

                <!-- TANGGAL TRANSAKSI -->
                <div class="form-group">
                    <label>Tanggal Transaksi</label>
                    <input type="text" id="displayTanggal" readonly>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="button" id="btnSave" class="btn btn-primary" style="margin-top: 8px;">
                    SIMPAN DATA
                </button>

                <div class="action-group">
                    <button type="button" id="btnResetAll" class="btn btn-secondary">
                        INPUT ITEM BARU
                    </button>
                </div>
            </form>
        </div>

        <!-- FITUR TABEL INPUT HARI INI -->
        <div class="card">
            <div class="today-list-header">
                <h2>📊 Tabel Input Hari Ini</h2>
                <span id="todayCount" class="today-count">0 Item</span>
            </div>

            <!-- TABEL CONTAINER -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Jam</th>
                            <th>Item Name</th>                            
                            <th>Item Code</th>
                            <th>Batch</th>
                            <th>Qty</th>
                            <th>Remark</th>
                        </tr>
                    </thead>
                    <tbody id="todayTableBody">
                        <tr>
                            <td colspan="6" class="empty-today">Belum ada data diinput hari ini.</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" style="text-align: right;">Total Qty:</td>
                            <td id="todayTotalQty" style="color: var(--primary-color);">0</td>
                            <td colspan="2"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- QR SCANNER MODAL -->
    <div id="scanner-modal">
        <div class="scanner-box">
            <h3 style="margin-bottom: 12px;">Scan QR Item Code</h3>
            <div id="reader"></div>
            <button type="button" id="btnCloseScanner" class="btn btn-danger">TUTUP SCANNER</button>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        /* CONFIGURATION */
        const FIREBASE_DB_URL = "https://ambil-data-dd0d1-default-rtdb.asia-southeast1.firebasedatabase.app";
        const DATA_PATH = "data_stok";
        const ENDPOINT_URL = `${FIREBASE_DB_URL}/${DATA_PATH}.json`;
        
        // API SCRIPT MASTER ITEM (Sumber Data Item Desc & Number)
        const MASTER_API_URL = "https://script.google.com/macros/s/AKfycbyOZYxkl19Izb5LxnrrggkEgFEjqnlhXlfJGJN3Ld4VLuKvSIjgXlDIMkEI1dqwyH_M5g/exec";

        /* STATE MANAGEMENT */
        let stockData = []; // Cache lokal data Firebase (Penyimpanan transaksi)
        let masterItems = []; // Cache master item dari Apps Script API
        let html5QrCode = null;
        let isSaving = false;
        let selectedItemCode = "";

        /* INITIALIZATION */
        document.addEventListener("DOMContentLoaded", () => {
            initDateDisplay();
            fetchFirebaseData();
            fetchMasterItems();
            setupEventListeners();
        });

        // Set Tanggal Hari Ini (Format Display ID: DD/MM/YYYY, Format Firebase: YYYY-MM-DD)
        function initDateDisplay() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            document.getElementById("displayTanggal").value = `${day}/${month}/${year}`;
        }

        function getTodayISOString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /* MASTER ITEMS API FETCH (GOOGLE APPS SCRIPT) */
        async function fetchMasterItems() {
            try {
                const response = await fetch(MASTER_API_URL);
                if (!response.ok) throw new Error("Gagal mengambil master item.");
                const data = await response.json();
                
                // Normalisasi struktur data API
                if (Array.isArray(data)) {
                    masterItems = data;
                } else if (data.data && Array.isArray(data.data)) {
                    masterItems = data.data;
                } else {
                    masterItems = Object.values(data);
                }
            } catch (error) {
                console.error("Master API Error:", error);
            }
        }

        /* FIREBASE API FUNCTIONS */
        async function fetchFirebaseData() {
            showLoading(true, "Memuat data Firebase...");
            try {
                const response = await fetch(ENDPOINT_URL);
                if (!response.ok) throw new Error("Gagal terhubung ke database.");
                
                const data = await response.json();
                stockData = [];

                if (data) {
                    Object.keys(data).forEach(key => {
                        stockData.push({
                            _id: key,
                            ...data[key]
                        });
                    });
                }

                updateConnectionStatus(true);
                showAlert("", "hide");
                renderTodayTable(); // Render tabel setelah data dimuat
            } catch (error) {
                console.error("Firebase Error:", error);
                updateConnectionStatus(false);
                showAlert("⚠ Firebase tidak dapat diakses atau koneksi terputus.", "error");
            } finally {
                showLoading(false);
            }
        }

        async function saveStockToFirebase(payload) {
            const response = await fetch(ENDPOINT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error("Gagal mengirim data ke Firebase.");
            }

            return await response.json();
        }

        /* STATUS INDIKATOR */
        function updateConnectionStatus(isOnline) {
            const statusBadge = document.getElementById("connectionStatus");
            const statusText = document.getElementById("statusText");
            const dot = statusBadge.querySelector(".dot");

            if (isOnline) {
                statusBadge.className = "status-badge status-online";
                dot.className = "dot dot-online";
                statusText.innerText = "Online";
            } else {
                statusBadge.className = "status-badge status-offline";
                dot.className = "dot dot-offline";
                statusText.innerText = "Offline";
            }
        }

        /* EVENT LISTENERS SETUP */
        function setupEventListeners() {
            // Event Listener Item Code
            const itemCodeInput = document.getElementById("itemCode");
            itemCodeInput.addEventListener("input", handleItemCodeInput);
            itemCodeInput.addEventListener("focus", handleItemCodeInput);

            // Event Listener Item Name / Item Desc (Fitur Autocomplete Wildcard)
            const itemNameInput = document.getElementById("itemName");
            itemNameInput.addEventListener("input", handleItemNameInput);
            itemNameInput.addEventListener("focus", handleItemNameInput);

            // Event Listener Batch
            const batchInput = document.getElementById("batchInput");
            batchInput.addEventListener("focus", showBatchSuggestions);
            batchInput.addEventListener("input", checkCustomBatchInput);

            // Hide Suggestions List Saat Klik di Luar Element
            document.addEventListener("click", (e) => {
                if (!e.target.closest("#itemCode") && !e.target.closest("#itemSuggestions")) {
                    hideElement("itemSuggestions");
                }
                if (!e.target.closest("#itemName") && !e.target.closest("#descSuggestions")) {
                    hideElement("descSuggestions");
                }
                if (!e.target.closest("#batchInput") && !e.target.closest("#batchSuggestions")) {
                    hideElement("batchSuggestions");
                }
            });

            document.getElementById("btnScanQR").addEventListener("click", startQRScanner);
            document.getElementById("btnCloseScanner").addEventListener("click", stopQRScanner);
            document.getElementById("btnSave").addEventListener("click", handleSave);
            document.getElementById("btnResetAll").addEventListener("click", resetFullForm);
        }

        /* LOGIKA HELPER MENDAPATKAN ITEM DARI SOURCE (COMBINED API MASTER + FIREBASE) */
        function getAllKnownItems() {
            const map = new Map();

            // 1. Dari Master API
            masterItems.forEach(item => {
                const code = item.itemnumber || item.item_code || item.code || item.ItemNumber || "";
                const name = item.itemname || item.item_desc || item.name || item.ItemName || "";
                if (code) {
                    map.set(String(code).trim(), String(name).trim());
                }
            });

            // 2. Dari Historical Data Firebase
            stockData.forEach(item => {
                if (item.itemnumber && !map.has(item.itemnumber)) {
                    map.set(String(item.itemnumber).trim(), String(item.itemname || "").trim());
                }
            });

            return Array.from(map.entries()).map(([code, name]) => ({ code, name }));
        }

        /* AUTOCOMPLETE UTILS: WILDCARD SEARCH (Mendukung pola *java*aged*) */
        function matchWildcardPattern(text, pattern) {
            if (!pattern) return true;
            
            // Mengubah input wildcard seperti *java*aged* menjadi regex regex pattern
            // Pisahkan kata berdasarkan tanda * atau spasi
            const keywords = pattern.toLowerCase().split(/[\s*]+/).filter(k => k.length > 0);
            
            if (keywords.length === 0) return true;

            const target = text.toLowerCase();
            return keywords.every(kw => target.includes(kw));
        }

        /* AUTOCOMPLETE PADA ITEM CODE */
        function handleItemCodeInput(e) {
            const query = e.target.value.trim().toLowerCase();
            const suggestionsContainer = document.getElementById("itemSuggestions");

            if (!query) {
                suggestionsContainer.innerHTML = "";
                hideElement("itemSuggestions");
                return;
            }

            const items = getAllKnownItems();
            const filtered = items.filter(item => item.code.toLowerCase().includes(query)).slice(0, 10);

            if (filtered.length === 0) {
                suggestionsContainer.innerHTML = `<div class="suggestion-item"><em>Item Code tidak ditemukan</em></div>`;
                showElement("itemSuggestions");
                return;
            }

            suggestionsContainer.innerHTML = filtered.map(item => `
                <div class="suggestion-item" onclick="selectItemFromCode('${escapeHtml(item.code)}')">
                    <div class="item-code">${escapeHtml(item.code)}</div>
                    <div class="item-desc">${escapeHtml(item.name)}</div>
                </div>
            `).join("");

            showElement("itemSuggestions");
        }

        /* AUTOCOMPLETE PADA ITEM DESC (UNTUK WILDCARD / KATA TERPISAH) */
        function handleItemNameInput(e) {
            const query = e.target.value.trim();
            const suggestionsContainer = document.getElementById("descSuggestions");

            if (!query) {
                suggestionsContainer.innerHTML = "";
                hideElement("descSuggestions");
                return;
            }

            const items = getAllKnownItems();
            const filtered = items.filter(item => matchWildcardPattern(item.name, query)).slice(0, 12);

            if (filtered.length === 0) {
                suggestionsContainer.innerHTML = `<div class="suggestion-item"><em>Deskripsi item tidak ditemukan</em></div>`;
                showElement("descSuggestions");
                return;
            }

            suggestionsContainer.innerHTML = filtered.map(item => `
                <div class="suggestion-item" onclick="selectItemFromDesc('${escapeHtml(item.code)}', '${escapeHtml(item.name)}')">
                    <div class="item-desc">${escapeHtml(item.name)}</div>
                    <div class="item-code">Code: ${escapeHtml(item.code)}</div>
                </div>
            `).join("");

            showElement("descSuggestions");
        }

        /* PILIH DARI AUTOCOMPLETE ITEM CODE */
        function selectItemFromCode(itemCode) {
            document.getElementById("itemCode").value = itemCode;
            hideElement("itemSuggestions");
            processSelectedItem(itemCode);
        }

        /* PILIH DARI AUTOCOMPLETE ITEM DESC */
        function selectItemFromDesc(itemCode, itemName) {
            document.getElementById("itemCode").value = itemCode;
            document.getElementById("itemName").value = itemName;
            hideElement("descSuggestions");
            processSelectedItem(itemCode, itemName);
        }

        function processSelectedItem(itemCode, providedName = null) {
            selectedItemCode = itemCode;
            
            const items = getAllKnownItems();
            const matched = items.find(i => i.code === itemCode);

            const itemName = providedName || (matched ? matched.name : "-");
            document.getElementById("itemName").value = itemName;
            
            showAlert("", "hide");
            setFormInputsEnabled(true);

            // Ambil histori record dari Firebase untuk pencarian batch
            const itemRecords = stockData.filter(d => d.itemnumber === itemCode);
            processBatchSelection(itemRecords);
        }

        /* LOGIKA BATCH (30 HARI TERAKHIR) */
        function processBatchSelection(itemRecords) {
            const today = new Date();
            today.setHours(23, 59, 59, 999);
            
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);
            thirtyDaysAgo.setHours(0, 0, 0, 0);

            function parseRecordDate(dateStr) {
                if (!dateStr) return null;
                const parts = String(dateStr).trim().split('-');
                if (parts.length === 3) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10) - 1;
                    const d = parseInt(parts[2], 10);
                    return new Date(y, m, d);
                }
                return null;
            }

            const recentRecords = itemRecords.filter(r => {
                if (!r.batch) return false;
                const recDate = parseRecordDate(r.tanggal);
                return recDate && recDate >= thirtyDaysAgo && recDate <= today;
            });

            const recordsToProcess = recentRecords.length > 0 ? recentRecords : itemRecords.filter(r => r.batch);

            if (recordsToProcess.length === 0) {
                document.getElementById("batchInput").value = "";
                document.getElementById("batchInfo").innerText = "Tidak ada riwayat batch untuk Item ini. Silakan ketik batch secara manual.";
                document.getElementById("batchInfo").style.color = "var(--warning-color)";
                window.currentSortedBatches = [];
                return;
            }

            const batchMap = new Map();
            recordsToProcess.forEach(r => {
                const b = String(r.batch).trim();
                if (!b) return;

                const recordDateStr = String(r.tanggal || "");
                const uploadedAt = String(r.uploaded_at || "");

                if (!batchMap.has(b)) {
                    batchMap.set(b, { tanggal: recordDateStr, uploaded_at: uploadedAt, record: r });
                } else {
                    const existing = batchMap.get(b);
                    if (recordDateStr > existing.tanggal) {
                        batchMap.set(b, { tanggal: recordDateStr, uploaded_at: uploadedAt, record: r });
                    } else if (recordDateStr === existing.tanggal && uploadedAt > existing.uploaded_at) {
                        batchMap.set(b, { tanggal: recordDateStr, uploaded_at: uploadedAt, record: r });
                    }
                }
            });

            const sortedBatches = Array.from(batchMap.entries()).sort((a, b) => {
                if (b[1].tanggal !== a[1].tanggal) {
                    return b[1].tanggal.localeCompare(a[1].tanggal);
                }
                return b[1].uploaded_at.localeCompare(a[1].uploaded_at);
            });

            const defaultBatch = sortedBatches[0][0];
            const latestInfo = sortedBatches[0][1].record;

            document.getElementById("batchInput").value = defaultBatch;
            window.currentSortedBatches = sortedBatches.map(item => item[0]);

            if (recentRecords.length > 0) {
                document.getElementById("batchInfo").innerText = `Batch ditemukan dari data 30 hari terakhir. (Terakhir: ${formatDisplayDate(latestInfo.tanggal)}, Stok: ${latestInfo.stok})`;
                document.getElementById("batchInfo").style.color = "var(--text-muted)";
            } else {
                document.getElementById("batchInfo").innerText = `Menggunakan batch historical: ${defaultBatch}`;
                document.getElementById("batchInfo").style.color = "var(--warning-color)";
            }
        }

        function showBatchSuggestions() {
            if (!window.currentSortedBatches || window.currentSortedBatches.length === 0) return;

            const container = document.getElementById("batchSuggestions");
            container.innerHTML = window.currentSortedBatches.map(b => `
                <div class="suggestion-item" onclick="selectBatch('${escapeHtml(b)}')">
                    <div class="item-code">${escapeHtml(b)}</div>
                </div>
            `).join("");

            showElement("batchSuggestions");
        }

        function selectBatch(batchValue) {
            document.getElementById("batchInput").value = batchValue;
            hideElement("batchSuggestions");
            checkCustomBatchInput();
        }

        function checkCustomBatchInput() {
            const currentVal = document.getElementById("batchInput").value.trim();
            const batchInfo = document.getElementById("batchInfo");

            if (window.currentSortedBatches && window.currentSortedBatches.includes(currentVal)) {
                batchInfo.innerText = "Batch ditemukan dari histori.";
                batchInfo.style.color = "var(--text-muted)";
            } else if (currentVal !== "") {
                batchInfo.innerText = "Batch baru.";
                batchInfo.style.color = "var(--warning-color)";
            } else {
                batchInfo.innerText = "";
            }
        }

        /* QR SCANNER INTEGRATION */
        function startQRScanner() {
            showElement("scanner-modal");
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Camera access error:", err);
                stopQRScanner();
                showAlert("⚠ Kamera tidak dapat diakses atau izin ditolak.", "error");
            });
        }

        function onScanSuccess(decodedText) {
            const itemCode = decodedText.trim();
            stopQRScanner();

            document.getElementById("itemCode").value = itemCode;
            processSelectedItem(itemCode);

            setTimeout(() => {
                document.getElementById("qtyInput").focus();
            }, 300);
        }

        function onScanFailure(error) {}

        function stopQRScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    hideElement("scanner-modal");
                }).catch(err => {
                    console.error("Failed to stop scanner", err);
                    hideElement("scanner-modal");
                });
            } else {
                hideElement("scanner-modal");
            }
        }

        /* SAVE DATA LOGIC & VALIDATION */
        async function handleSave() {
            if (isSaving) return;

            const itemCode = document.getElementById("itemCode").value.trim();
            const itemName = document.getElementById("itemName").value.trim();
            const batch = document.getElementById("batchInput").value.trim();
            const qtyStr = document.getElementById("qtyInput").value;
            const qty = parseFloat(qtyStr);
            const remark = document.getElementById("remarkInput").value.trim();
            const posisi = document.getElementById("posisiInput").value.trim();

            if (!itemCode) {
                showAlert("⚠ Item Code belum diisi.", "error");
                return;
            }
            if (!itemName) {
                showAlert("⚠ Item Desc belum diisi.", "error");
                return;
            }
            if (!batch) {
                showAlert("⚠ Batch tidak boleh kosong.", "error");
                return;
            }
            if (isNaN(qty) || qty <= 0) {
                showAlert("⚠ Qty harus berupa angka dan lebih besar dari 0.", "error");
                return;
            }

            const payload = {
                batch: batch,
                itemname: itemName,
                itemnumber: itemCode,
                remark: remark || "",
                posisi: posisi || "",
                stok: qty,
                tanggal: getTodayISOString(),
                uploaded_at: new Date().toISOString()
            };

            isSaving = true;
            document.getElementById("btnSave").disabled = true;
            showLoading(true, "Menyimpan data...");

            try {
                const response = await saveStockToFirebase(payload);
                
                stockData.push({
                    _id: response.name,
                    ...payload
                });

                showAlert(`✓ DATA BERHASIL DISIMPAN<br><br>Item: <b>${escapeHtml(itemCode)}</b><br>Desc: <b>${escapeHtml(itemName)}</b><br>Batch: <b>${escapeHtml(batch)}</b><br>Qty: <b>${qty}</b>`, "success");

                // Reset Input Form
                document.getElementById("qtyInput").value = "";
                document.getElementById("remarkInput").value = "";
                document.getElementById("posisiInput").value = "";

                // Refresh Data Batch & Tabel Hari Ini
                const itemRecords = stockData.filter(d => d.itemnumber === itemCode);
                processBatchSelection(itemRecords);
                renderTodayTable();

            } catch (error) {
                console.error("Save Error:", error);
                showAlert("⚠ Gagal menyimpan data ke Firebase. Periksa koneksi internet.", "error");
            } finally {
                isSaving = false;
                document.getElementById("btnSave").disabled = false;
                showLoading(false);
            }
        }

        /* FITUR: RENDER TABEL DAFTAR INPUT HARI INI */
        function renderTodayTable() {
            const todayISO = getTodayISOString();
            const tbody = document.getElementById("todayTableBody");
            
            // Filter data yang diinput pada hari ini
            const todayData = stockData.filter(item => String(item.tanggal) === todayISO);

            // Urutkan dari yang terbaru diinput
            todayData.sort((a, b) => String(b.uploaded_at || "").localeCompare(String(a.uploaded_at || "")));

            // Hitung ringkasan
            document.getElementById("todayCount").innerText = `${todayData.length} Item`;
            
            const totalQty = todayData.reduce((sum, item) => sum + (parseFloat(item.stok) || 0), 0);
            document.getElementById("todayTotalQty").innerText = totalQty.toLocaleString("id-ID");

            if (todayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-today">Belum ada data diinput hari ini.</td></tr>`;
                return;
            }

            tbody.innerHTML = todayData.map(item => {
                const timeStr = item.uploaded_at ? new Date(item.uploaded_at).toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' }) : '-';
                return `
                    <tr>
                        <td>${timeStr}</td>
                        <td><b>${escapeHtml(item.itemname)}</b></td>
                        <td><b>${escapeHtml(item.itemnumber)}</b></td>
                        <td>${escapeHtml(item.batch)}</td>
                        <td style="color: var(--success-color); font-weight:700;">+${item.stok}</td>
                        <td>${escapeHtml(item.remark || '-')}</td>
                    </tr>
                `;
            }).join("");
        }

        /* FORM RESET HELPERS */
        function resetFullForm() {
            document.getElementById("stockForm").reset();
            document.getElementById("batchInfo").innerText = "";
            initDateDisplay();
            selectedItemCode = "";
            window.currentSortedBatches = [];
            setFormInputsEnabled(true);
            showAlert("", "hide");
            document.getElementById("itemCode").focus();
        }

        function setFormInputsEnabled(enabled) {
            document.getElementById("batchInput").disabled = !enabled;
            document.getElementById("qtyInput").disabled = !enabled;
            document.getElementById("remarkInput").disabled = !enabled;
            document.getElementById("posisiInput").disabled = !enabled;
            document.getElementById("btnSave").disabled = !enabled;
        }

        /* UI UTILITY FUNCTIONS */
        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            if (type === "hide") {
                alertBox.style.display = "none";
                return;
            }
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = message;
            alertBox.style.display = "block";
        }

        function showLoading(show, text = "Memuat...") {
            const overlay = document.getElementById("loadingOverlay");
            document.getElementById("loadingText").innerText = text;
            overlay.style.display = show ? "flex" : "none";
        }

        function showElement(id) {
            document.getElementById(id).style.display = "block";
        }

        function hideElement(id) {
            document.getElementById(id).style.display = "none";
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return "-";
            const parts = dateStr.split("-");
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
