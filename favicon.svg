<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradasi Warna -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3436" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Luar Transparan dengan Border Gradasi Glow -->
  <rect x="4" y="4" width="92" height="92" rx="22" 
        fill="none" stroke="url(#orangeGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- QR Code Position Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left -->
  <rect x="14" y="14" width="22" height="22" rx="6" fill="url(#darkGrad)"/>
  <rect x="18" y="18" width="14" height="14" rx="3" fill="#FFFFFF"/>
  <rect x="21" y="21" width="8" height="8" rx="2" fill="url(#orangeGrad)"/>

  <!-- Top-Right -->
  <rect x="64" y="14" width="22" height="22" rx="6" fill="url(#darkGrad)"/>
  <rect x="68" y="18" width="14" height="14" rx="3" fill="#FFFFFF"/>
  <rect x="71" y="21" width="8" height="8" rx="2" fill="url(#orangeGrad)"/>

  <!-- Bottom-Left -->
  <rect x="14" y="64" width="22" height="22" rx="6" fill="url(#darkGrad)"/>
  <rect x="18" y="68" width="14" height="14" rx="3" fill="#FFFFFF"/>
  <rect x="21" y="71" width="8" height="8" rx="2" fill="url(#orangeGrad)"/>

  <!-- Elemen Data QR Code -->
  <g fill="url(#darkGrad)" rx="2">
    <rect x="42" y="14" width="6" height="6" rx="2"/>
    <rect x="52" y="14" width="6" height="6" rx="2"/>
    <rect x="42" y="24" width="6" height="6" rx="2"/>
    <rect x="52" y="22" width="6" height="10" rx="2" fill="url(#orangeGrad)"/>

    <rect x="40" y="38" width="6" height="6" rx="2"/>
    <rect x="50" y="36" width="8" height="8" rx="2"/>
    <rect x="62" y="40" width="6" height="6" rx="2"/>

    <rect x="42" y="50" width="8" height="8" rx="2" fill="url(#orangeGrad)"/>
    <rect x="54" y="48" width="6" height="6" rx="2"/>

    <rect x="40" y="64" width="6" height="6" rx="2"/>
    <rect x="50" y="62" width="8" height="6" rx="2"/>

    <rect x="42" y="76" width="6" height="8" rx="2"/>
    <rect x="52" y="78" width="6" height="6" rx="2"/>
  </g>

  <!-- Ikon Paket / Box 3D Modern -->
  <g transform="translate(4, 2)">
    <!-- Sisi Atas Paket -->
    <path d="M 58,52 L 72,44 L 86,52 L 72,60 Z" fill="#FFB142"/>
    <!-- Sisi Kiri Paket -->
    <path d="M 58,52 L 72,60 L 72,78 L 58,70 Z" fill="#FF793F"/>
    <!-- Sisi Kanan Paket -->
    <path d="M 72,60 L 86,52 L 86,70 L 72,78 Z" fill="#CD6133"/>
    
    <!-- Lakban/Tape Atas -->
    <path d="M 68,46 L 76,51 L 76,62 L 68,57 Z" fill="#FFEAA7" opacity="0.8"/>
  </g>
</svg>
